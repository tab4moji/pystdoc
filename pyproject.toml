[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pystdoc"
version = "0.8.0"
description = "Python Structural & Topological Documentation Engine (pystdoc): High-precision, LLM-powered hierarchical codebase and architecture documentation generator."
readme = "README.md"
authors = [
    { name = "tab4moji" }
]
license = { text = "MIT" }
keywords = ["documentation", "llm", "ast", "clang", "architecture", "topological", "dag", "pystdoc", "mermaid"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
requires-python = ">=3.10"
dependencies = [
    "libclang>=16.0.0",
    "javalang>=0.13.0",
    "kopyt>=0.0.2",
    "mcp>=1.0.0",
]

[project.scripts]
pystdoc = "pystdoc.cli:reportgen_main"
reportgen = "pystdoc.cli:reportgen_main"
docgen = "pystdoc.cli:docgen_main"
designgen = "pystdoc.cli:designgen_main"

[project.urls]
Homepage = "https://github.com/tab4moji/pystdoc"
Repository = "https://github.com/tab4moji/pystdoc"
Issues = "https://github.com/tab4moji/pystdoc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.pylint.main]
# Third-party libs without static member info (javalang) / libclang.
extension-pkg-allow-list = []

[tool.pylint.messages_control]
# Intentional design choices of this code base:
#  - broad-exception-caught: parsers must never crash a whole sync run
#  - import-outside-toplevel: optional/heavy deps are imported lazily
#  - complexity/size metrics, duplicate-code, cyclic-import (adapter registry)
#  - invalid-name: ast.NodeVisitor visit_* methods and module singletons
disable = [
    "broad-exception-caught",
    "import-outside-toplevel",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-instance-attributes",
    "too-many-nested-blocks",
    "too-many-lines",
    "too-few-public-methods",
    "duplicate-code",
    "cyclic-import",
    "no-else-return",
    "no-else-break",
    "invalid-name",
    "disallowed-name",
    "global-statement",
    "protected-access",
    "unnecessary-ellipsis",
    "missing-function-docstring",
    "missing-class-docstring",
    "missing-module-docstring",
    "consider-using-with",
    "attribute-defined-outside-init",
    "cell-var-from-loop",
    "unused-argument",
    "no-member",
]
